[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderai-agent"
dynamic = ["version"]
description = "AI pair programming in your terminal — modular core (snippet tools, bounded agent loop, permissions)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "CoderAI", email = "hello@coderai.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rich>=13.7.0",
    "openai>=1.10.0",
    "requests>=2.31.0",
    "pypdf>=6.19,<7",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.0",
    "jsonschema>=4.26,<5",
    "referencing>=0.37,<1",
    "pathspec>=1.1,<2",
    "tomlkit>=0.12.0",
    "certifi>=2024.0.0",
    # loguru is required (also pulled in by kosong).
    # Core engine deps (kosong 0.56.x, bundled local KAOS,
    # fastmcp-slim 3.2.x, agent-client-protocol 0.8.x).
    # NOTE: ranges are capped at next-minor/major to avoid silent breaking
    # upgrades; bump deliberately. CLI is argparse-only (no typer/click).
    "kosong>=0.56,<0.57",
    "fastmcp-slim[client]>=3.2,<4",
    "streamingjson>=0.0.5,<1",
    "jinja2>=3.1",
    "aiofiles>=24",
    "agent-client-protocol>=0.8,<0.9",
    # Telemetry transport (async).
    "aiohttp>=3.10",
    "multidict>=6.9.1,<7",
    # Reject the vulnerable transitive JWT versions used by MCP authentication.
    "PyJWT>=2.15.0,<3",
    # Direct imports that previously resolved only transitively (kept explicit
    # so a parent dropping them cannot silently break the wheel): loguru via
    # kosong, pygments + markdown-it-py via rich, urllib3 via requests.
    "loguru>=0.7.3",
    "pygments>=2.21.0",
    "markdown-it-py>=4.2.0",
    "urllib3>=2.8.0",
    # NOTE: keyring (coderai/auth/oauth.py) and setproctitle
    # (coderai/utils/proctitle.py) stay soft-optional by design — both import
    # behind try/except and degrade gracefully (file-store fallback / no-op).
    # keyring currently arrives via fastmcp-slim[client]; declare it explicitly
    # before ever dropping that extra (silent OAuth-token regression otherwise).
]

[project.optional-dependencies]
media = [
    # Clipboard / image paste (optional: headless/server installs skip this).
    # Import via `pip install coderai-agent[media]`.
    "pillow>=10",
    "pyperclip>=1.8",
]
jev = [
    # Jev System-One triage/gate for /review (optional: without it every non-doc
    # file is reviewed and every comment shown). `pip install coderai-agent[jev]`.
    "typesafe-sdk>=0.7.1,<0.8",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "ruff==0.16.8",
    "mypy==2.4.0",
    "types-requests==2.33.0.20260906",
    "types-PyYAML==6.0.12.20260906",
    "pip-audit==2.10.1",
]

[project.urls]
Homepage = "https://github.com/adityaanilraut/CoderAI"
Source = "https://github.com/adityaanilraut/CoderAI"

[project.scripts]
coderai = "coderai.main:main"
cai = "coderai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coderai*"]

[tool.setuptools.package-data]
coderai = [
    "py.typed",
    "kaos/LICENSE",
    "kaos/NOTICE",
    "kaos/README.md",
    "prompt/templates/*.md",
    "tools/*/*.md",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
    "skills/*/scripts/*.py",
    "agents/*/*.yaml",
    "agents/*/*.md",
]

[tool.setuptools.exclude-package-data]
coderai = ["vendor/rg", "vendor/rg-*", "vendor/rg.exe", "**/__pycache__/*", "**/*.py[cod]"]

[tool.setuptools.dynamic]
version = {attr = "coderai._version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "UP006", "UP035"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

# Remaining debt is explicit and budgeted in docs/type-suppression-budget.json.
[[tool.mypy.overrides]]
module = [
    "coderai.background.summary",
    "coderai.cli.info",
    "coderai.llm",
    "coderai.soul.coderaisoul",
    "coderai.soul.message",
    "coderai.tools",
    "coderai.tools.ask_user",
    "coderai.tools.background",
    "coderai.tools.file.replace",
    "coderai.tools.session.query",
    "coderai.tools.shell",
    "coderai.ui.shell.app",
    "coderai.ui.shell.dispatch",
    "coderai.ui.shell.placeholders",
    "coderai.ui.shell.prompt",
    "coderai.ui.shell.prompt_completers",
    "coderai.ui.shell.slash",
    "coderai.ui.shell.visualize._approval_panel",
    "coderai.utils.aioqueue",
    "coderai.utils.media_tags",
]
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "security: security and permissions regression tests",
]
