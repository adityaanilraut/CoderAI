[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coderai-agent"
dynamic = ["version"]
description = "AI pair programming in your terminal — modular core (snippet tools, bounded agent loop, permissions)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "CoderAI", email = "hello@coderai.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "rich>=13.7.0",
    "openai>=1.10.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.0",
    "tomlkit>=0.12.0",
    # loguru is optional: log.py falls back to stdlib logging when absent.
    # Core engine deps (kosong 0.56.0, pykaos 0.9.0, typer 0.21.1,
    # fastmcp 3.2.4, agent-client-protocol 0.8.0).
    "kosong[contrib]==0.56.0",
    "pykaos==0.9.0",
    "typer>=0.21",
    "fastmcp>=3.2",
    "streamingjson==0.0.5",
    "jinja2>=3.1",
    "aiofiles>=24",
    "agent-client-protocol>=0.8",
    # Clipboard (pillow/pyperclip) + telemetry transport (aiohttp).
    "pillow>=10",
    "pyperclip>=1.8",
    "aiohttp>=3.10",
    "certifi>=2024",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.31.0.0",
    "types-PyYAML>=6.0",
    # Binary packaging (coderai.spec + scripts/verify_binary.py).
    "pyinstaller>=6.0",
]

[project.urls]
Homepage = "https://github.com/adityaanilraut/CoderAI"
Source = "https://github.com/adityaanilraut/CoderAI"

[project.scripts]
coderai = "coderai.main:main"
cai = "coderai.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coderai*"]

[tool.setuptools.package-data]
coderai = [
    "vendor/rg",
    "vendor/rg-*",
    "vendor/rg.exe",
    "prompts/*.md",
    "tools/plan/*.md",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
    "skills/*/scripts/*.py",
    "agents/*/*.yaml",
    "agents/*/*.md",
]

[tool.setuptools.dynamic]
version = {attr = "coderai._version.__version__"}

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP006", "UP035"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "security: security and permissions regression tests",
]
