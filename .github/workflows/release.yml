name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to validate without publishing (e.g. 0.5.0)"
        required: true
        type: string

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ github.sha }}

  build:
    name: Build and attest once
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and verify version
        id: tag
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_CANDIDATE: ${{ inputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          PACKAGE_VERSION="$(python -c 'import runpy; print(runpy.run_path("coderai/_version.py")["__version__"])')"
          if [[ "${GITHUB_EVENT_NAME}" = "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            test "${TAG}" = "v${PACKAGE_VERSION}" || {
              echo "Release tag ${TAG} must exactly match v${PACKAGE_VERSION}" >&2
              exit 1
            }
          else
            VERSION="${RELEASE_CANDIDATE}"
            test "${VERSION}" = "${PACKAGE_VERSION}" || {
              echo "Requested candidate ${VERSION} does not match package version ${PACKAGE_VERSION}" >&2
              exit 1
            }
            TAG="v${VERSION}"
          fi
          VERSION="${PACKAGE_VERSION}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel and sdist
        env:
          CODERAI_BUILD_SHA: ${{ steps.tag.outputs.source_sha }}
        run: |
          python scripts/inject_build_sha.py
          python -m build

      - name: Check wheel archive contents
        run: python scripts/verify_wheel.py dist --archive-only --expected-sha "${{ steps.tag.outputs.source_sha }}" --expected-version "${{ steps.tag.outputs.version }}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload immutable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke-wheel:
    name: Smoke wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Checkout smoke-test harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download exact release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Install and probe wheel from an empty directory
        run: python scripts/verify_wheel.py dist --audit --audit-report .verification/wheel-audit.json --expected-sha "${{ needs.build.outputs.source_sha }}" --expected-version "${{ needs.build.outputs.version }}"

      - name: Preserve installed-wheel audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-audit-${{ matrix.os }}-${{ matrix.python-version }}
          path: .verification/

  publish-github-release:
    name: Publish exact artifacts to GitHub
    if: github.event_name == 'push'
    needs: [verification, build, smoke-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          files: dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            Attested Python wheel and sdist, built once and smoke-tested from the
            exact uploaded artifact on supported Python and OS combinations.

            ```bash
            pip install coderai-agent==${{ needs.build.outputs.version }}
            coderai
            ```

  publish-pypi:
    name: Publish the same artifacts to PyPI
    if: github.event_name == 'push'
    needs: [verification, build, smoke-wheel, publish-github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download exact release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
