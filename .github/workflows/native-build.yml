name: Build standalone CLI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: bun run test:native
      - uses: actions/upload-artifact@v4
        with:
          name: coderai-${{ matrix.target }}
          path: |
            dist-bun/coderai-bun-${{ matrix.target }}.zip
            dist-bun/coderai-bun-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - uses: actions/download-artifact@v4
        with:
          pattern: coderai-*
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft \
            --title "CoderAI $GITHUB_REF_NAME" \
            --notes 'Download the ZIP for your platform and verify it against the matching SHA-256 checksum. Extract the executable, put it on your PATH, and run `coderai --setup`.'
