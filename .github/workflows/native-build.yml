name: Build standalone CLI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      release-kind: ${{ steps.version.outputs.kind }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.event_name == 'push'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Verify release version
        id: version
        if: github.event_name == 'push'
        run: |
          kind=$(bun scripts/release-version.mjs "$GITHUB_REF_NAME")
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: bun run test:native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coderai-${{ matrix.target }}
          path: |
            dist-bun/coderai-bun-${{ matrix.target }}.zip
            dist-bun/coderai-bun-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coderai-*
          path: release-assets
          merge-multiple: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Generate Homebrew formula from verified archives
        if: needs.preflight.outputs.release-kind == 'stable'
        run: bun scripts/build-homebrew.mjs --assets-dir release-assets --output release-assets/coderai.rb
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ needs.preflight.outputs.release-kind }}
        shell: bash
        run: |
          set -euo pipefail
          release_args=(--verify-tag --draft)
          if [[ "$RELEASE_KIND" == prerelease ]]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-assets/* "${release_args[@]}" \
            --title "CoderAI $GITHUB_REF_NAME" \
            --notes 'Download the ZIP for your platform and verify it against the matching SHA-256 checksum. Extract the executable, put it on your PATH, and run `coderai --setup`.'
