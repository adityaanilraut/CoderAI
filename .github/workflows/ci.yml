name: CLI verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: bun run typecheck
      - if: runner.os != 'Windows'
        run: bun run test
      - if: runner.os == 'Windows'
        run: bun run build
      - name: Verify Windows headless behavior
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git --version
          bash --version
          rg --version
          bun test test/portable-cli.test.mjs test/config-commands.test.mjs test/mcp-config.test.mjs test/provider-adapters.test.mjs
