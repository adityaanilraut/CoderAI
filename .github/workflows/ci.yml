name: CLI verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - if: runner.os == 'Windows'
        run: choco install ripgrep -y --no-progress
      - run: bun run typecheck
      - if: runner.os != 'Windows'
        run: bun run test
      - if: runner.os == 'Windows'
        run: bun run build
      - name: Verify Windows headless behavior
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git --version
          bash --version
          rg --version
          bun test test/portable-cli.test.mjs test/config-commands.test.mjs test/mcp-config.test.mjs test/provider-adapters.test.mjs
