name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows is best-effort / non-blocking (matrix.experimental). Primary
    # support is POSIX (Linux + macOS). See SECURITY.md "Supported platforms".
    # Promote to blocking (drop experimental) once the Windows runner is green.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Format
        run: python -m ruff format --check coderai/ tests/ scripts/

      - name: Ruff Lint
        run: python -m ruff check coderai/ tests/ scripts/

      - name: Mypy
        run: python -m mypy coderai/

      - name: Pytest
        run: pytest -q --cov=coderai --cov-fail-under=63

      - name: CLI smoke test
        run: coderai --version

  security:
    name: Security regression suite
    runs-on: ubuntu-latest
    # Block promotion if security regressions fail, even though main test job also exercises them.
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Keep a separate status for the security corpus even though the coverage
      # job also exercises it.
      - name: Security tests
        run: pytest -m security -q

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.lock --desc --strict

  package:
    name: Clean-wheel smoke test
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Install wheel and probe packaged capabilities from an empty directory
        run: python scripts/verify_wheel.py dist
