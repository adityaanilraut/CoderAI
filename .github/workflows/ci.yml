name: CLI verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: bun run typecheck
      - if: runner.os != 'Windows'
        run: bun run test
      # The terminal suite uses POSIX PTYs; Windows still validates compilation
      # and the built CLI until native Windows terminal coverage is available.
      - if: runner.os == 'Windows'
        run: bun run build
      - if: runner.os == 'Windows'
        run: bun dist/coderai.mjs --help
