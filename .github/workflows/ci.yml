name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/verify.yml
    with:
      source_sha: ${{ github.sha }}

  package:
    name: Clean-wheel smoke test
    runs-on: ubuntu-latest
    needs: verification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python scripts/inject_build_sha.py
          python -m build
      - name: Probe and audit the installed wheel
        run: python scripts/verify_wheel.py dist --audit --audit-report .verification/wheel-audit.json --expected-sha "${{ github.sha }}"
      - name: Preserve installed-wheel audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-wheel-audit
          path: .verification/
