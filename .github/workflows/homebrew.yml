name: Update Homebrew tap
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v0.6.0)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: homebrew-tap
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Download the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$(gh release view --json tagName --jq .tagName)"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern 'coderai-bun-darwin-*.zip*' --pattern 'coderai-bun-linux-*.zip*'
          bun scripts/build-homebrew.mjs --version "${RELEASE_TAG#v}" \
            --assets-dir release-assets --output Formula/coderai.rb
      - name: Publish the formula in this repository
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add Formula/coderai.rb
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update Homebrew formula to $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
