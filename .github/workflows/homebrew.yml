name: Update Homebrew tap
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example, v0.6.0)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: homebrew-tap
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Download the latest published stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$(gh release view --json tagName --jq .tagName)"
          test "$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '.isDraft or .isPrerelease')" = false
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern 'coderai-bun-darwin-*.zip*' --pattern 'coderai-bun-linux-*.zip*'
          bun scripts/build-homebrew.mjs --version "${RELEASE_TAG#v}" \
            --assets-dir release-assets --output "$RUNNER_TEMP/coderai.rb"
      - name: Publish the formula in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: bash scripts/publish-homebrew.sh "$RELEASE_TAG" "$DEFAULT_BRANCH" "$RUNNER_TEMP/coderai.rb"
