# Uses the same project environment, tool versions and full scopes as make/CI.
# Setup: .venv/bin/python -m pip install pre-commit && pre-commit install
repos:
  - repo: local
    hooks:
      - id: coderai-lint
        name: Ruff lint (shared full scope)
        entry: .venv/bin/python scripts/verification.py lint
        language: system
        pass_filenames: false
        always_run: true
      - id: coderai-format
        name: Ruff format (check only, shared full scope)
        entry: .venv/bin/python scripts/verification.py format-check
        language: system
        pass_filenames: false
        always_run: true
      - id: coderai-types
        name: Mypy and suppression budget (engine and SDK)
        entry: .venv/bin/python scripts/verification.py typecheck
        language: system
        pass_filenames: false
        always_run: true
