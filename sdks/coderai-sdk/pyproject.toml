[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coderai-sdk"
version = "0.1.0"
description = "Headless Python SDK for driving CoderAI sessions programmatically (no terminal)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "UP006", "UP035"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
